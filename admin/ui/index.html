<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>网站管理 · Wind Studio</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-icon">w<span>•</span></span><span>wind<span class="brand-sub">CONTENT STUDIO</span></span></a>
    <div class="workspace"><span class="workspace-avatar">W</span><div><strong id="workspace-name">我的个人网站</strong><small><span class="dot"></span> 本机工作空间</small></div><span class="workspace-arrow">⌘</span></div>
    <p class="nav-label">工作空间</p>
    <nav id="navigation" aria-label="后台导航">
      <a href="#dashboard" data-page="dashboard"><span data-icon="dashboard"></span>概览<span class="nav-end">⌂</span></a>
      <a href="#profile" data-page="profile"><span data-icon="user"></span>个人资料</a>
      <a href="#blog" data-page="blog"><span data-icon="file"></span>博客文章<span id="blog-count" class="count"></span></a>
      <a href="#projects" data-page="projects"><span data-icon="box"></span>项目作品<span id="projects-count" class="count"></span></a>
      <a href="#awards" data-page="awards"><span data-icon="award"></span>荣誉证书</a>
      <a href="#media" data-page="media"><span data-icon="image"></span>素材库</a>
      <span class="nav-divider"></span><p class="nav-label">站点管理</p>
      <a href="#settings" data-page="settings"><span data-icon="settings"></span>网站设置</a>
      <a href="#publish" data-page="publish"><span data-icon="git"></span>发布与同步<span class="nav-indicator"></span></a>
    </nav>
    <div class="sidebar-bottom"><div class="local-note"><span data-icon="shield"></span><span>你的内容，只在你的电脑上<small>保存后由你决定何时发布</small></span></div><div class="account"><span class="avatar">W</span><div><strong id="account-name">wind</strong><small>网站管理员</small></div><span class="online-dot"></span></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb">工作空间<span>/</span><strong id="breadcrumb">概览</strong></div><div class="top-actions"><span class="local-badge"><span class="dot"></span> 本机后台</span><button class="button ghost small" id="preview-site"><span data-icon="external"></span>预览网站</button><span class="avatar mini">W</span></div></header>
    <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span> 正在读取网站内容…</div></main>
    <footer class="app-footer"><span>WIND STUDIO <span class="footer-divider">/</span> 把想法变成下一次更新。</span><span>本地编辑 · GitHub 发布</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
</body>
</html>
